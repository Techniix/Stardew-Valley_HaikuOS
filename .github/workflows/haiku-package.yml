name: Haiku package

on:
  push:
    branches: [main]
    tags: ["haiku-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. haiku-v0.1.0); leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A release comes from pushing a haiku-v* tag or from running the
      # workflow by hand with release_tag set.
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/haiku-v') && github.ref_name) || '' }}
    steps:
      - name: Check release tag
        if: env.RELEASE_TAG != ''
        run: |
          case "$RELEASE_TAG" in
            haiku-v[0-9]*) ;;
            *) echo "Release tags must look like haiku-v1.2.3 (got '$RELEASE_TAG')"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning haiku/*.sh

      - name: Build managed parts and assemble package
        run: SDV_VERSION="$RELEASE_TAG" ./haiku/build-managed.sh

      - name: Check native shims compile
        run: ./haiku/build-native.sh /tmp/shim-check

      - uses: actions/upload-artifact@v4
        with:
          name: StardewValley-haiku
          path: haiku/out/StardewValley-haiku.zip

      - name: Release notes
        if: env.RELEASE_TAG != ''
        run: |
          notes="docs/release-notes/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            printf '%s\n' \
              'Unzip on Haiku (x86_64), then run `./setup.sh` in Terminal.' \
              'Contains no game files; you need your own copy of Stardew Valley.' \
              'See the README for details.' > "$notes"
          fi
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Stardew Valley for HaikuOS ${{ env.RELEASE_TAG }}
          files: haiku/out/StardewValley-haiku.zip
          body_path: ${{ env.NOTES_FILE }}
